<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agriculture Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
        }

        #container {
            margin-top: 20px;
        }

        .new-task {
            color: #4CAF50;
            font-weight: bold;
        }

        #taskMessage {
            color: #FF6347;
            font-size: 1.2em;
        }

        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            background-color: #45a049;
        }

        .task-list {
            margin-top: 20px;
            list-style-type: none;
            padding: 0;
        }

        .task-list li {
            padding: 8px;
            background-color: #e0f7fa;
            margin: 5px 0;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <header>
        <h1>Agriculture Management System</h1>
    </header>

    <main>
        <section id="container">
            <p id="taskMessage">Welcome to the farming management system. Track and manage farming tasks!</p>

            <button id="addTaskButton">Add New Task</button>
            <button id="removeTaskButton">Remove Last Task</button>

            <h2>Current Tasks</h2>
            <ul id="taskList" class="task-list"></ul>
        </section>
    </main>

    <footer>
        <p>Powered by your farming team. Keep the fields green!</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
